[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computer-use-replay"
version = "0.1.0"
description = "Reviewed UI capabilities discovered with an LLM and executed without one"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "playwright>=1.51,<2",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "google-re2>=1.1,<2",
]

[project.scripts]
computer-use-replay = "computer_use_replay.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use_replay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires a genuine model endpoint (not part of offline CI)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
parallel = true
source = ["computer_use_replay"]

[tool.coverage.report]
show_missing = true
